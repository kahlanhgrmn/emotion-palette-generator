<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>Emotion Palette Camera - step 1</title>
        <link rel="stylesheet" href = "styles.css">
    </head>
    <body>
        <div class = "app">
            <h1>Emotion Palette Cam - Step 1</h1>
            <p class = "subtitle">Allow webcam access to try out some filters</p>

            <div class = "video-container">
                <video id = "video" autoplay playsinline></video>
                <div id="overlay" class="overlay"></div>
            </div>

            <div class = "controls">
                <button data-mood = "none">No Filter</button>
                <button data-mood = "happy">Happy</button>
                <button data-mood = "calm">Calm</button>
                <button data-mood = "sad">Sad</button>
                <button data-mood = "angry">Angry</button>
            </div>

            <p class = "note">This is the 1st step: webcam and manual buttons for filters.</p>
        </div>

        <script src = "script.js"></script>
    </body>
</html>
